{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="auth-section section">
    <div class="container">
        <div class="auth-card reveal-fade-up">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon"><i class="ri-shopping-bag-3-fill"></i></span>
                    <span class="logo-text">Shop<span class="logo-accent">Ease</span></span>
                </div>
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-sub">Join ShopEase to track orders, save items, and checkout faster.</p>
            </div>

            <form action="{% url 'register' %}" method="POST" class="auth-form">
                {% csrf_token %}
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon-wrap">
                        <i class="ri-user-line"></i>
                        <input type="text" name="username" id="username" class="form-input" placeholder="Choose a username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-icon-wrap">
                        <i class="ri-mail-line"></i>
                        <input type="email" name="email" id="email" class="form-input" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrap">
                        <i class="ri-lock-line"></i>
                        <input type="password" name="password" id="password" class="form-input" placeholder="At least 6 characters" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-icon-wrap">
                        <i class="ri-lock-password-line"></i>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-input" placeholder="Re-enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--lg btn--full auth-btn">
                    Create Account <i class="ri-arrow-right-line"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{% url 'login' %}{% if next %}?next={{ next }}{% endif %}" class="auth-link">Sign In</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
