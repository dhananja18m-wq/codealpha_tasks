{% extends 'base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="auth-section section">
    <div class="container">
        <div class="auth-card reveal-fade-up">
            <div class="auth-header">
                <div class="auth-logo">
                    <span class="logo-icon"><i class="ri-shopping-bag-3-fill"></i></span>
                    <span class="logo-text">Shop<span class="logo-accent">Ease</span></span>
                </div>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-sub">Sign in to your account to continue shopping.</p>
            </div>

            <form action="{% url 'login' %}" method="POST" class="auth-form">
                {% csrf_token %}
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon-wrap">
                        <i class="ri-user-line"></i>
                        <input type="text" name="username" id="username" class="form-input" placeholder="Your username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon-wrap">
                        <i class="ri-lock-line"></i>
                        <input type="password" name="password" id="password" class="form-input" placeholder="Your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary btn--lg btn--full auth-btn">
                    Sign In <i class="ri-arrow-right-line"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account yet? <a href="{% url 'register' %}{% if next %}?next={{ next }}{% endif %}" class="auth-link">Create Account</a></p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
