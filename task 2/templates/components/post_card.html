<article class="post-card" data-post-id="{{ post.id }}" id="post-{{ post.id }}">
    <!-- Post Header -->
    <header class="post-header">
        <a href="{% url 'profile' %}" class="post-author-info">
            <div class="post-avatar-wrapper">
                <img src="{{ post.avatar }}" alt="{{ post.author_name }}" class="post-avatar" loading="lazy">
            </div>
            <div class="post-author-text">
                <span class="post-author-name">{{ post.author_name }}</span>
                <span class="post-author-username">@{{ post.username }} • <span class="post-time">{{ post.time_ago }}</span></span>
            </div>
        </a>
    </header>

    <!-- Post Media / Image -->
    <div class="post-media-container" data-post-id="{{ post.id }}">
        <img src="{{ post.image }}" alt="Photo by {{ post.author_name }}" class="post-image" loading="lazy">
        <!-- Floating Heart Animation Overlay for double-tap -->
        <div class="floating-heart" aria-hidden="true">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="#fa5a3e" stroke="#fa5a3e" stroke-width="1.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
        </div>
    </div>

    <!-- Post Actions Bar -->
    <div class="post-actions-bar">
        <!-- Like Action Button -->
        <button type="button" 
                class="action-btn like-btn {% if post.is_liked %}liked{% endif %}" 
                data-post-id="{{ post.id }}" 
                data-liked="{% if post.is_liked %}true{% else %}false{% endif %}"
                data-likes-count="{{ post.likes_count }}"
                aria-label="{% if post.is_liked %}Unlike post{% else %}Like post{% endif %}"
                aria-pressed="{% if post.is_liked %}true{% else %}false{% endif %}">
            <span class="action-icon heart-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="{% if post.is_liked %}#fa5a3e{% else %}none{% endif %}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
            </span>
            <span class="action-count likes-count" data-post-id="{{ post.id }}">{{ post.formatted_likes }}</span>
        </button>

        <!-- Comment Action Button -->
        <button type="button" 
                class="action-btn comment-btn" 
                data-post-id="{{ post.id }}"
                aria-label="Open comments">
            <span class="action-icon comment-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </span>
            <span class="action-count comments-count" data-post-id="{{ post.id }}">{{ post.comments_count }}</span>
        </button>
    </div>

    <!-- Post Caption -->
    <div class="post-caption-box">
        <span class="caption-username">{{ post.username }}</span>
        <span class="caption-text">{{ post.caption }}</span>
    </div>

    <!-- Comments Section (UI Required) -->
    <div class="post-comments-container">
        <!-- View All Comments Button if more than 2 -->
        {% if post.comments|length > 0 %}
        <button type="button" class="btn-view-all-comments" data-post-id="{{ post.id }}">
            View all {{ post.comments_count }} comments
        </button>
        {% endif %}

        <!-- Inline Comments List -->
        <div class="inline-comments-list" id="post-comments-list-{{ post.id }}">
            {% for comment in post.comments %}
            <div class="comment-item" id="comment-{{ comment.id }}">
                <div class="comment-content">
                    <span class="comment-username">{{ comment.username }}</span>
                    <span class="comment-text">{{ comment.text }}</span>
                </div>
                <span class="comment-time">{{ comment.time }}</span>
            </div>
            {% endfor %}
        </div>

        <!-- Inline Add Comment Input Form -->
        <form class="inline-comment-form" data-post-id="{{ post.id }}" onsubmit="event.preventDefault();">
            <input type="text" 
                   class="inline-comment-input" 
                   placeholder="Add a comment..." 
                   aria-label="Add a comment"
                   autocomplete="off" 
                   maxlength="280">
            <button type="submit" class="btn-inline-submit" aria-label="Submit comment">
                <span>Post</span>
            </button>
        </form>
    </div>
</article>
