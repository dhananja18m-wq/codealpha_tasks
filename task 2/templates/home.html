{% extends 'base.html' %}
{% load static %}

{% block title %}Feed — Aura Social{% endblock %}

{% block content %}
<div class="feed-page-wrapper">
    <div class="feed-main-container">
        
        <!-- Feed Top Heading & Refresh Hint -->
        <div class="feed-top-bar">
            <h1 class="feed-title">Latest Moments</h1>
            <button type="button" class="btn-skeleton-toggle" id="simulateLoadingBtn" title="Simulate feed refresh animation">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                <span>Refresh Demo</span>
            </button>
        </div>

        <!-- Skeleton Loading Placeholder (hidden after initial render or during refresh) -->
        <div id="feedSkeletonContainer" class="feed-skeleton-container" aria-hidden="true" style="display: none;">
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar skeleton-pulse"></div>
                    <div class="skeleton-text-group">
                        <div class="skeleton-line-title skeleton-pulse"></div>
                        <div class="skeleton-line-sub skeleton-pulse"></div>
                    </div>
                </div>
                <div class="skeleton-media skeleton-pulse"></div>
                <div class="skeleton-footer">
                    <div class="skeleton-pill skeleton-pulse"></div>
                    <div class="skeleton-line-caption skeleton-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Posts Feed Stream -->
        <section class="posts-feed-stream" id="postsFeedStream" aria-label="Social Posts Stream">
            {% for post in posts %}
                {% include 'components/post_card.html' with post=post %}
            {% endfor %}
        </section>

        <!-- Feed End Indicator -->
        <div class="feed-end-marker">
            <div class="end-dot"></div>
            <span>You're all caught up</span>
        </div>

    </div>
</div>
{% endblock %}
