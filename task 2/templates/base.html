{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>{% block title %}Aura Social — Share Moments{% endblock %}</title>
    <!-- Google Fonts for modern geometric typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Main styles & Animations -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="page-body">
    <!-- Global Progress / Transition Line -->
    <div id="pageTransitionBar" class="page-transition-bar"></div>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <a href="{% url 'home' %}" class="brand-logo" aria-label="Aura Social Homepage">
                <span class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 3a9 9 0 0 1 9 9"></path>
                    </svg>
                </span>
                <span class="brand-text">Aura</span>
            </a>

            <!-- Desktop & Tablet Navigation (Strictly Home & Profile) -->
            <nav class="desktop-nav" aria-label="Main Navigation">
                <a href="{% url 'home' %}" class="nav-link {% if active_page == 'home' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>Home</span>
                </a>
                <a href="{% url 'profile' %}" class="nav-link {% if active_page == 'profile' %}active{% endif %}">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Profile</span>
                </a>
            </nav>

            <!-- Quick Profile Pill Header Right -->
            <div class="header-user-pill">
                <a href="{% url 'profile' %}" class="user-pill-link" title="View Profile">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=120&q=80" alt="Rachel's profile avatar" class="pill-avatar">
                    <span class="pill-name">Rachel</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="mainContent" class="main-layout page-enter">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Fixed Bottom Navigation Bar (Strictly Home & Profile) -->
    <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
        <a href="{% url 'home' %}" class="mobile-nav-item {% if active_page == 'home' %}active{% endif %}" aria-label="Home Feed">
            <svg class="mobile-nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span class="mobile-nav-label">Home</span>
        </a>

        <a href="{% url 'profile' %}" class="mobile-nav-item {% if active_page == 'profile' %}active{% endif %}" aria-label="User Profile">
            <svg class="mobile-nav-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span class="mobile-nav-label">Profile</span>
        </a>
    </nav>

    <!-- Global Comment Drawer / Modal -->
    <div id="commentModal" class="comment-modal-backdrop" aria-hidden="true" role="dialog" aria-labelledby="commentModalTitle">
        <div class="comment-modal-dialog">
            <div class="modal-handle-bar"></div>
            <div class="modal-header">
                <h3 id="commentModalTitle" class="modal-title">Comments</h3>
                <button type="button" class="btn-close-modal" id="closeCommentModalBtn" aria-label="Close comments">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="modal-comments-list" id="modalCommentsList">
                <!-- Dynamically populated or rendered -->
            </div>

            <!-- Comment Input Box Form -->
            <form id="modalCommentForm" class="comment-input-form" onsubmit="event.preventDefault();">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=100&q=80" alt="Current user avatar" class="comment-author-avatar">
                <div class="comment-input-wrapper">
                    <input type="text" id="modalCommentInput" class="comment-text-input" placeholder="Add a comment as Rachel..." autocomplete="off" maxlength="300" required>
                    <button type="submit" id="modalCommentSubmitBtn" class="btn-submit-comment" aria-label="Post comment">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/app.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
